# apps/monitoring/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-monitoring-appl
  namespace: openshift-gitops
spec:
  project: redis-project
  source:
    repoURL: 'https://github.com/<org>/gitops-repo.git'
    targetRevision: main
    path: apps/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: redis-platform   # PrometheusRule lives here
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
