# Baseline: deny all ingress by default, then explicitly allow only what's
# needed. Add a further NetworkPolicy here (namespaceSelector-based) once the
# actual consumer namespace(s) for redis-app/redis-db are decided — see
# Section 5 of the LLD.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: redis-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: redis-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
