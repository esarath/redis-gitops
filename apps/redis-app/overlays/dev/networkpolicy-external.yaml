apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-redis-test
  namespace: redis-platform
spec:
  podSelector:
    matchLabels:
      app: redis-app
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 6379
      # scope this if you can — e.g. your home/test public IP as a /32 ipBlock —
      # instead of leaving it open to all sources
