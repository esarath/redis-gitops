apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-app
  namespace: redis-platform
spec:
  replicas: 2
  selector:
    matchLabels: { app: redis-app }
  template:
    metadata:
      labels: { app: redis-app }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: redis-app }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: redis
          image: docker.io/bitnamilegacy/redis:7.2.5-debian-12-r6
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: redis-app-auth, key: redis-password }
          ports: [{ containerPort: 6379 }]
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /bitnami/redis/data
          livenessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "--no-auth-warning", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "--no-auth-warning", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
